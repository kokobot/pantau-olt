name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: PantauOLT-apk, path: app/build/outputs/apk/debug/app-debug.apk }
      - name: Publish APK to apk branch
        run: |
          mkdir /tmp/pub && cp app/build/outputs/apk/debug/app-debug.apk /tmp/pub/PantauOLT.apk
          cd /tmp/pub && git init -q -b apk && git config user.name github-actions && git config user.email actions@github.com
          git add PantauOLT.apk && git commit -q -m "APK build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk
